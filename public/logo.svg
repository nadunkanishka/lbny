<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <g id="logo-figures" fill="#7E3BEE">
    <!-- Upright Figure (Left) -->
    <g id="single-figure">
      <!-- Head -->
      <circle cx="64" cy="48" r="34" />
      <!-- Torso Stem -->
      <path d="M 64 78 C 55 125 45 175 64 242" stroke="#7E3BEE" stroke-width="26" stroke-linecap="round" fill="none" />
      <!-- Left Branch -->
      <path d="M 54 132 L 12 174" stroke="#7E3BEE" stroke-width="26" stroke-linecap="round" fill="none" />
      <!-- Right Branch -->
      <path d="M 66 120 L 134 164" stroke="#7E3BEE" stroke-width="26" stroke-linecap="round" fill="none" />
    </g>
    <!-- Inverted Figure (Right) - Rotated 180° around center (128, 128) -->
    <use href="#single-figure" transform="rotate(180 128 128)" />
  </g>
</svg>
